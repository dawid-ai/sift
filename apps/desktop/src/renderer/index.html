<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- img-src: sift-thumb: serves locally-cached channel thumbnails; https:/data: cover
         remote thumbnails not yet routed through the cache. Images are inert; scripts/styles/
         connections stay locked to 'self'. -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: sift-thumb:; media-src 'self' sift-media:" />
    <!-- Pre-JS loading fallback only; main.tsx sets document.title from @sift/core branding. -->
    <title>Sift</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
