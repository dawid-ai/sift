# .github/workflows/ci.yml
# INERT until a GitHub remote exists. Runs the full gate on push/PR.
name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
