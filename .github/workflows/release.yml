# .github/workflows/release.yml
# Tag a commit `v0.0.5` (etc.) and push it to build + publish the Windows installer
# to GitHub Releases (electron-updater reads latest.yml from there).
name: Release
on:
  push:
    tags: ["v*"]
jobs:
  build-win:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sift/desktop run rebuild
      # Publishes the NSIS installer + latest.yml to the GitHub Release for this tag.
      # Signing activates automatically if CSC_LINK / CSC_KEY_PASSWORD secrets are set.
      - run: pnpm --filter @sift/desktop exec electron-vite build && pnpm --filter @sift/desktop exec electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
