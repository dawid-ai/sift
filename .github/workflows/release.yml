# .github/workflows/release.yml
# Tag a commit `v0.0.5` (etc.) and push it to build + publish the Windows installer
# to GitHub Releases (electron-updater reads latest.yml from there).
name: Release
on:
  push:
    tags: ["v*"]
jobs:
  gate:
    # The release used to publish straight from a tag, so a tag pushed on a red commit
    # shipped anyway. Publishing now depends on this job passing.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm audit --prod

  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sift/desktop run rebuild
      - run: pnpm --filter @sift/desktop exec playwright install --with-deps chromium
      - run: pnpm --filter @sift/desktop run e2e

  build-win:
    needs: [gate, e2e]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sift/desktop run rebuild
      # Create the release BEFORE electron-builder publishes into it. v0.7.0 shipped broken
      # without this: electron-builder runs a publisher per artifact, both raced on
      # "release doesn't exist", and each created its own — two releases on one tag, the
      # installer and latest.yml in the one nobody linked, and the job still exited 0. A
      # duplicated tag also makes the release un-PATCHable, so the notes could not be set.
      # With the release already there, every publisher just uploads. `|| true` keeps a
      # re-run idempotent when the release exists.
      #
      # The notes come from this version's UPDATES.md entry. electron-updater serves them
      # as the in-app "what's new", so an empty body is a broken release, not a cosmetic one.
      - name: Create the GitHub release with notes from UPDATES.md
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes="$(awk -v t="## ${tag} " '
            index($0, t) == 1 { on = 1; next }
            on && /^## v/ { exit }
            on { print }
          ' UPDATES.md)"
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "No UPDATES.md entry for ${tag} — add one before tagging." >&2
            exit 1
          fi
          gh release create "$tag" --title "$tag" --notes "$notes" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Publishes the NSIS installer + latest.yml to the GitHub Release for this tag.
      # Signing activates automatically if CSC_LINK / CSC_KEY_PASSWORD secrets are set.
      - run: pnpm --filter @sift/desktop exec electron-vite build && pnpm --filter @sift/desktop exec electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

  sbom:
    needs: [gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # What ships and under what licence, recorded per release. `pnpm licenses` reads the
      # lockfile, so no extra tooling is needed.
      - run: pnpm licenses list --prod --json > sbom-licenses.json
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: sift-sbom.spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: license-report
          path: sbom-licenses.json
          retention-days: 90
